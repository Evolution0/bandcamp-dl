name: Run the test suite

on:
  pull_request:
  # pushes to master are covered by the "test" job of publish-to-test-pypi.yml,
  # which gates the TestPyPI upload, so running the suite here as well would
  # only duplicate it

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install bandcamp-dl and its test extras
      run: python -m pip install -e ".[test]"
    - name: Run pytest under coverage
      run: python -m coverage run -m pytest
    - name: Report coverage, fails under the configured floor
      run: python -m coverage report
    - name: Write the XML report Codecov reads
      run: python -m coverage xml
    # this is the only suite run for a pull request, so the number it uploads is
    # what Codecov shows for the PR; the badge in README.rst reads the master run
    - name: Upload the coverage report to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        flags: pull-request
