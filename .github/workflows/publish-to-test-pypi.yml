name: Build and publish bandcamp-downloader to TestPyPI

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Test the release before publishing
    # the gate: publish-to-testpypi will not start while this job is red; the name
    # keeps this check apart from the "test" check tests.yml reports on pull requests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install bandcamp-dl and its test extras
      run: python -m pip install -e ".[test]"
    - name: Run pytest under coverage
      run: python -m coverage run -m pytest
    - name: Report coverage, fails under the configured floor
      run: python -m coverage report
    - name: Write the XML report Codecov reads
      run: python -m coverage xml
    # this is the only suite run on a master push, so the number it uploads is the
    # one the master coverage badge in README.rst reads
    - name: Upload the coverage report to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: master

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    # build pulls setuptools from the build-system table in an isolated environment,
    # so the runner itself only needs the build frontend
    - name: Build a binary wheel and a source tarball
      run: python -m pip install build && python -m build
    - name: Hand the distributions to the publish job
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: [test, build]
    runs-on: ubuntu-latest
    # the identity TestPyPI matches this run against: the publisher you registered
    # names this repository, this workflow file and the testpypi environment
    environment:
      name: testpypi
      url: https://test.pypi.org/project/bandcamp-dl/
    permissions:
      # mandatory for trusted publishing, scoped to the job that flies the dists
      id-token: write
    steps:
    - name: Download the distributions built by the build job
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # no password: the OIDC token exchanged for a short-lived API token is
        # what authenticates the upload, and with it in play the action also
        # signs digital attestations for every file it uploads
        repository-url: https://test.pypi.org/legacy/
